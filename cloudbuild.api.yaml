# Builds the Dockerfile, pushes it to Artifact Registry and deploys the API to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.api.yaml --project=<project-id> \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
#
# Tag images with the commit SHA so every revision maps to a commit.
#
# $PROJECT_ID is provided by Cloud Build. Override any `_` substitution with
#   --substitutions=_TAG=v1.5.2,_REGION=europe-west1
# _ALLOWED_ORIGINS takes one origin. For several, use gcloud's custom-delimiter
# syntax in --set-env-vars (see `gcloud topic escaping`).
#
# Values that contain commas (_SECRETS) need a custom delimiter for --substitutions, e.g.
#   --substitutions='^~^_TAG=abc123~_SECRETS=DATABASE_URL=my-db-url:latest,JWT_SECRET=my-jwt:latest'
#
# Settings not set here (Cloud SQL attachment, VPC egress, service account) are kept from the
# service's current revision; set them once with `gcloud run services update` (docs/deployment-gcp.md).

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '3000'
      - --memory
      - 2Gi
      - --cpu
      - '2'
      # Keep max instances x DB pool size (10 per instance, src/db/client.ts)
      # below the database's connection limit. 3 fits a small instance (~50).
      - --max-instances
      - ${_MAX_INSTANCES}
      - --min-instances
      - '0'
      - --concurrency
      - '80'
      # Longest request: a chat answer, stopped after 2 minutes (src/api/chat-generation.ts)
      - --timeout
      - '180'
      - --cpu-boost
      - --set-env-vars
      - NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,INSIGHTS_PROVIDER=groq,ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},TRUST_PROXY_HOPS=${_TRUST_PROXY_HOPS},ANON_IP_DAILY_LIMIT=${_ANON_IP_DAILY_LIMIT},ANON_GLOBAL_DAILY_LIMIT=${_ANON_GLOBAL_DAILY_LIMIT},SIGNED_IN_GLOBAL_DAILY_LIMIT=${_SIGNED_IN_GLOBAL_DAILY_LIMIT},CHAT_MODE=${_CHAT_MODE},AUTH_ALLOWED_PROVIDERS=${_AUTH_ALLOWED_PROVIDERS},RATE_LIMIT_MODE=${_RATE_LIMIT_MODE},RATE_LIMIT_CHAT_PER_MIN=${_RATE_LIMIT_CHAT_PER_MIN},RATE_LIMIT_SEARCH_PER_MIN=${_RATE_LIMIT_SEARCH_PER_MIN},RATE_LIMIT_LOGIN_PER_MIN=${_RATE_LIMIT_LOGIN_PER_MIN},RATE_LIMIT_DEFAULT_PER_MIN=${_RATE_LIMIT_DEFAULT_PER_MIN}
      - --set-secrets
      - ${_SECRETS}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

substitutions:
  _TAG: latest
  _REGION: us-central1
  _REPO: coursecorrect
  _IMAGE: cc-backend
  _SERVICE: cc-backend-v1-5
  _ALLOWED_ORIGINS: https://coursecorrect.fyi
  _MAX_INSTANCES: '3'
  # Abuse limits: read docs/deployment-gcp.md ("Client IP and abuse limits") before changing.
  # Number of proxies in front of the app: 1 = Cloud Run reached directly (no load balancer or CDN).
  _TRUST_PROXY_HOPS: '1'
  # Anonymous chat questions per visitor IP per day, across sessions (0 = off)
  _ANON_IP_DAILY_LIMIT: '20'
  # Anonymous chat questions per day, all visitors together (0 = off)
  _ANON_GLOBAL_DAILY_LIMIT: '1000'
  # Chat emergency switch: on | signed_in_only | off (docs/deployment-gcp.md §6)
  _CHAT_MODE: 'on'
  # Signed-in chat questions per day, all users together (0 = off)
  _SIGNED_IN_GLOBAL_DAILY_LIMIT: '1000'
  # Firebase sign-in methods that may log in, separated by SPACES (commas would split --set-env-vars).
  # Read docs/auth-providers.md before adding one. Never "anonymous".
  _AUTH_ALLOWED_PROVIDERS: 'google.com'
  # Per-minute rate limits per visitor IP (0 = off for that group). "shadow" only logs what
  # would be rejected; switch to "enforce" after reviewing the logs (docs/deployment-gcp.md §6).
  _RATE_LIMIT_MODE: 'shadow'
  _RATE_LIMIT_CHAT_PER_MIN: '10'
  _RATE_LIMIT_SEARCH_PER_MIN: '60'
  _RATE_LIMIT_LOGIN_PER_MIN: '20'
  _RATE_LIMIT_DEFAULT_PER_MIN: '120'
  # ENV_VAR=secret-name:version pairs from Secret Manager (see docs/deployment-gcp.md).
  # TRUSTED_RELAY_SECRETS: the secret(s) the Next.js server sends in X-Relay-Secret (§6). Create it before deploying.
  _SECRETS: DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,GEMINI_API_KEY=gemini-api-key:latest,GROQ_API_KEY=groq-api-key:latest,TRUSTED_RELAY_SECRETS=trusted-relay-secrets:latest

# No options.machineType: the default build machine has a free monthly allowance, and this build
# (npm ci + tsc, no browser) doesn't need a bigger one.
